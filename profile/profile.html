<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../styles/global.css" rel="stylesheet" />
    <link href="profile.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <script src="profile.js" defer></script>
    <title>Stonely | Profile</title>
  </head>
  <body>
    <div id="main">
      <div id="iphone-outline">
        <div id="iphone-content">
          <div class="profile-screen">
            <!-- Header (Logo & current progress) -->

            <header class="profile-header">
              <div class="header-row">
                <h2>stonely<span>.</span></h2>
                <span id="step-count">1 / 8</span>
              </div>
              <div class="progress-track">
                <div id="progress-fill"></div>
              </div>
            </header>
            <!-- Container for the current question -->

            <main class="profile-content">
              <h1 id="question-title"></h1>
              <p id="question-subtitle"></p>
              <div id="answer-container"></div>
            </main>

            <!-- Footer (Navigate between questions) -->
            <footer class="profile-footer">
              <button id="back-btn" type="button">Back</button>
              <button id="next-btn" type="button">Continue →</button>
            </footer>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
