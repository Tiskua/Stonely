<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="styles/global.css" rel="stylesheet" />
    <link href="styles/profile.css" rel="stylesheet" />
    <title>Stonely</title>
  </head>

  <body>
    <div id="main">
      <div id="iphone-outline">
        <div id="iphone-content">
          <div class="screen-layout">
            <header class="header">
              <h1>Create your profile!</h1>
            </header>

            <main class="content">
              <div class="inputer-container">
                <label for="matters">What matters most to you?</label>

                <div class="radio-group">
                  <label class="radio-option">
                    <input type="radio" name="matters" value="friendship" />
                    Friendship
                  </label>

                  <label class="radio-option">
                    <input type="radio" name="matters" value="adventure" />
                    Adventure and new experiences
                  </label>

                  <label class="radio-option">
                    <input type="radio" name="matters" value="peace" />
                    Peace and stability
                  </label>
                  <label class="radio-option">
                    <input type="radio" name="matters" value="creativity" />
                    Creativity and self-expression
                  </label>
                  <label class="radio-option">
                    <input type="radio" name="matters" value="learning" />
                    Learning and personal growth
                  </label>
                </div>
              </div>
              <div class="inputer-container">
                <label for="unexpected"
                  >How do you handle unexpected situations?</label
                >

                <div class="radio-group">
                  <label class="radio-option">
                    <input type="radio" name="unexpected" value="flow" />
                    Go with the flow
                  </label>

                  <label class="radio-option">
                    <input type="radio" name="unexpected" value="plan" />
                    Make a plan
                  </label>

                  <label class="radio-option">
                    <input type="radio" name="unexpected" value="panice" />
                    Panic a little (but figure it out)
                  </label>
                  <label class="radio-option">
                    <input type="radio" name="unexpected" value="chaos" />
                    Embrace the chaos
                  </label>
                </div>
              </div>

                  </label>
                </div>

              <button><a href="profile2.html">Continue</a></button>
            </main>
          </div>
        </div>
      </div>
    </div>

</html>
