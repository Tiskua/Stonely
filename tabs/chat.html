<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="../styles/global.css" rel="stylesheet" />
    <link href="../styles/chat.css" rel="stylesheet" />
    <link href="../styles/TabBar.css" rel="stylesheet" />

    <script
      src="https://kit.fontawesome.com/e8b61a6feb.js"
      crossorigin="anonymous"
    ></script>

    <title>Stonely</title>
  </head>

  <body>
    <div id="main">
      <div id="iphone-outline">
        <div id="iphone-content">
          <div class="screen-layout">
            <main class="content">
              <!-- All Messages container -->
              <div style="width: 100%">
                <!-- Individual Message Container -->
                <div class="person-container" data-userid="Rok AI">
                  <!-- Profile Image -->
                  <div class="profile">
                    <img src="../images/rok-logo.png" async />
                  </div>
                  <!-- Latest Message -->
                  <div class="message-details">
                    <span class="person">Rock AI</span>
                    <span class="latest">This is the lastest message</span>
                  </div>
                </div>
                <div class="person-container" data-userid="Person 1">
                  <div class="profile">
                    <img src="../images/default-profile.png" async />
                  </div>
                  <div class="message-details">
                    <span class="person">Person 1</span>
                    <span class="latest">This is the lastest message</span>
                  </div>
                </div>
                <div class="person-container" data-userid="Person 2">
                  <div class="profile">
                    <img src="../images/default-profile.png" async />
                  </div>
                  <div class="message-details">
                    <span class="person">Person 2</span>
                    <span class="latest">This is the lastest message</span>
                  </div>
                </div>
                <div class="person-container" data-userid="Person 2">
                  <div class="profile">
                    <img src="../images/default-profile.png" async />
                  </div>
                  <div class="message-details">
                    <span class="person">Person 2</span>
                    <span class="latest">This is the lastest message</span>
                  </div>
                </div>
                <div class="person-container" data-userid="Person 2">
                  <div class="profile">
                    <img src="../images/default-profile.png" async />
                  </div>
                  <div class="message-details">
                    <span class="person">Person 2</span>
                    <span class="latest">This is the lastest message</span>
                  </div>
                </div>
                <div class="person-container" data-userid="Person 2">
                  <div class="profile">
                    <img src="../images/default-profile.png" async />
                  </div>
                  <div class="message-details">
                    <span class="person">Person 2</span>
                    <span class="latest">This is the lastest message</span>
                  </div>
                </div>
              </div>
            </main>
            <!-- Bottom Tabbar -->
            <footer>
              <tab-bar selected="chat"></tab-bar>
            </footer>
          </div>
        </div>
      </div>
    </div>
    <script src="../TabBar.js"></script>
    <script src="../scripts/chat.js"></script>
  </body>
</html>
