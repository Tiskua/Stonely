<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="../styles/global.css" rel="stylesheet" />
    <link href="../chat/chat.css" rel="stylesheet" />
    <link href="../Tabbar/TabBar.css" rel="stylesheet" />

    <script
      src="https://kit.fontawesome.com/e8b61a6feb.js"
      crossorigin="anonymous"
    ></script>

    <title>Stonely</title>
  </head>

  <body>
    <div id="main">
      <div id="iphone-outline">
        <div id="iphone-content">
          <div class="screen-layout">
            <main class="content">
              <!-- All Messages container -->
              <div style="width: 100%">
                <!-- Individual Message Container -->
                <div class="person-container" data-userid="user_rok_ai">
                  <!-- Profile Image -->
                  <div class="profile">
                    <img src="../images/rok-logo.png" async />
                  </div>
                  <!-- Latest Message -->
                  <div class="message-details">
                    <span class="person">Rok AI</span>
                    <span class="latest">Your personal Rok assistant</span>
                  </div>
                </div>
                <div class="person-container" data-userid="user_1">
                  <div class="profile">
                    <img src="../images/default-profile.png" async />
                  </div>
                  <div class="message-details">
                    <span class="person">Ethan Parker</span>
                    <span class="latest">Sounds good! See you tomorrow.</span>
                  </div>
                </div>
                <div class="person-container" data-userid="user_2">
                  <div class="profile">
                    <img src="../images/default-profile.png" async />
                  </div>
                  <div class="message-details">
                    <span class="person">Olivia Carter</span>
                    <span class="latest"
                      >Did you ever figure out what happened?</span
                    >
                  </div>
                </div>
                <div class="person-container" data-userid="user_3">
                  <div class="profile">
                    <img src="../images/default-profile.png" async />
                  </div>
                  <div class="message-details">
                    <span class="person">Sophie Bennett</span>
                    <span class="latest"
                      >Wait, I have to tell you something</span
                    >
                  </div>
                </div>
                <div class="person-container" data-userid="user_4">
                  <div class="profile">
                    <img src="../images/default-profile.png" async />
                  </div>
                  <div class="message-details">
                    <span class="person">Alex Morgan</span>
                    <span class="latest"
                      >Haha, no way you actually did that 💀</span
                    >
                  </div>
                </div>
                <div class="person-container" data-userid="user_5">
                  <div class="profile">
                    <img src="../images/default-profile.png" async />
                  </div>
                  <div class="message-details">
                    <span class="person">Mia Thompson</span>
                    <span class="latest"
                      >I'll send you the pictures later!</span
                    >
                  </div>
                </div>
              </div>
            </main>
            <!-- Bottom Tabbar -->
            <footer>
              <tab-bar selected="chat"></tab-bar>
            </footer>
          </div>
        </div>
      </div>
    </div>
    <script src="../Tabbar/TabBar.js"></script>
    <script src="../chat/chat.js"></script>
  </body>
</html>
