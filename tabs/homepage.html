<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="../styles/global.css" rel="stylesheet" />
    <link href="../home/homepage.css" rel="stylesheet" />
    <link href="../Tabbar/TabBar.css" rel="stylesheet" />

    <script
      src="https://kit.fontawesome.com/e8b61a6feb.js"
      crossorigin="anonymous"
    ></script>

    <title>Stonely</title>
  </head>

  <body>
    <div id="main">
      <div id="iphone-outline">
        <!-- Background image for environemnt -->
        <div class="environment-background"></div>
        <div id="iphone-content">
          <div class="screen-layout">
            <!-- Header (Settings | Rock Name | Outfits)-->

            <header class="header">
              <div
                style="
                  width: 100%;
                  display: flex;
                  flex-direction: row;
                  align-items: center;
                  justify-content: space-around;
                "
              >
                <a href="/settings/settings.html"
                  ><i class="fa-solid fa-gear fa-xl"></i
                ></a>
                <h2 id="rock-name">(ROCK NAME)</h2>
                <a href="../cosmetics/cosmetics.html"
                  ><i class="fa-solid fa-shirt fa-xl"></i
                ></a>
              </div>
            </header>
            <!-- Happiness Bar-->
            <div class="happiness-bar-bg">
              <div class="happiness-bar-cover"></div>
            </div>

            <!-- Main Content-->
            <main class="content">
              <head>
                <div id="pet-gif">
                  <img
                    type="text/javascript"
                    async
                    src="../images/petpet-transparent.gif"
                    style="width: 100%; height: 100%"
                  />
                </div>
                <!-- Food animation-->

                <div id="food-container"></div>
                <!-- Drink animation-->

                <div
                  id="drink-gif"
                  style="
                    position: absolute;
                    top: 64px;
                    right: 25px;
                    width: 200px;
                    height: 200px;

                    display: none;
                  "
                >
                  <img
                    type="text/javascript"
                    async
                    src="../images/drink.gif"
                    style="width: 100%; height: 100%"
                  />
                </div>
                <!-- Bubbles animation-->

                <div
                  id="bubbles-gif"
                  style="
                    position: absolute;
                    top: 100px;
                    width: 400px;
                    height: 400px;

                    display: none;
                  "
                >
                  <img
                    type="text/javascript"
                    async
                    src="../images/bubbles2.gif"
                    style="width: 100%; height: 80%"
                  />
                </div>
                <!-- Shower animation-->

                <div
                  id="shower-gif"
                  style="
                    position: absolute;
                    top: 70px;
                    right: -50px;
                    width: 400px;
                    height: 350px;
                    overflow: hidden;
                    transform: scaleX(-1);

                    display: none;
                  "
                >
                  <img
                    type="text/javascript"
                    async
                    src="../images/clean.gif"
                    style="width: 100%; height: 100%"
                  />
                </div>
                <!-- Slingshot animation-->

                <div id="slingshot-container">
                  <img
                    id="slingshot"
                    src="../images/slingshot.png"
                    alt="Slingshot"
                    style="
                      position: absolute;
                      top: 112px;
                      width: 300px;
                      height: 300px;
                      border-radius: 130px;
                      overflow: hidden;
                      display: none;
                    "
                  />
                </div>
                <div
                  id="launch"
                  style="
                    position: absolute;
                    top: 112px;
                    width: 300px;
                    height: 300px;
                    border-radius: 130px;
                    overflow: hidden;
                    display: none;
                  "
                >
                  <img
                    type="text/javascript"
                    async
                    src="../images/slingshotLaunch.png"
                    style="width: 100%; height: 100%"
                  />
                </div>
                <!-- Rock Container-->
                <div>
                  <img
                    src="../images/googly-eyes-rock.png"
                    alt="rock"
                    style="width: 100%; height: 100%; object-fit: contain"
                    id="rock"
                  />
                  <!-- Dirt Overlay-->
                  <div
                    id="dirt-overlay"
                    style="
                      position: absolute;
                      top: 92px;
                      width: 320px;
                      height: 300px;
                      border-radius: 130px;
                      overflow: hidden;
                      opacity: 0;
                    "
                  >
                    <img
                      type="text/javascript"
                      async
                      src="../images/DirtOverlay.png"
                      style="width: 100%; height: 100%"
                    />
                  </div>
                </div>
              </head>
              <!-- Actionable Buttons-->

              <div class="grid-container">
                <button onclick="feed()">Feed</button>
                <button onclick="drink()">Water</button>
                <button onclick="togglePet()">Pet</button>
                <button onclick="walk()">Take on Walk</button>
                <button onclick="clean()">Clean Rock</button>
                <button onclick="slingshot()">Slingshot</button>
              </div>
            </main>
            <!-- Bottom Tabbar-->

            <footer>
              <tab-bar selected="home"></tab-bar>
            </footer>
          </div>
        </div>
      </div>
    </div>
    <script src="../Tabbar/TabBar.js"></script>
    <script src="../home/home.js"></script>
  </body>
</html>
