<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../styles/global.css" rel="stylesheet" />
    <link href="../styles/homepage.css" rel="stylesheet" />
    <link href="../styles/TabBar.css" rel="stylesheet" />

    <script
      src="https://kit.fontawesome.com/e8b61a6feb.js"
      crossorigin="anonymous"
    ></script>

    <title>Stonely</title>
  </head>

  <body>
    <div id="main">
      <div id="iphone-outline">
        <div id="iphone-content">
          <div class="screen-layout">
            <header class="header">
              <div
                style="
                  width: 100%;
                  display: flex;
                  flex-direction: row;
                  align-items: center;
                  justify-content: space-around;
                "
              >
                <a href="../settings.html"
                  ><i class="fa-solid fa-gear fa-xl"></i
                ></a>
                <h2>(ROCK NAME)</h2>
                <a href="../cosmetics.html"
                  ><i class="fa-solid fa-shirt fa-xl"></i
                ></a>
              </div>
            </header>
            <!-- Happiness Bar-->

            <div class="happiness-bar-bg">
              <div class="happiness-bar-cover"></div>
            </div>

            <main class="content">
              <head>
                <div id="pet-gif">
                  <img
                    type="text/javascript"
                    async
                    src="../images/petpet-transparent.gif"
                    style="width: 100%; height: 100%"
                  />
                </div>
                <div id="food-container"></div>
                <div
                  id="drink-gif"
                  style="
                    position: absolute;
                    top: 100px;
                    right: 30px;
                    width: 200px;
                    height: 200px;

                    display: none;
                  "
                >
                  <img
                    type="text/javascript"
                    async
                    src="../images/drink.gif"
                    style="width: 100%; height: 100%"
                  />
                </div>
                <div
                  id="bubbles-gif"
                  style="
                    position: absolute;
                    top: 100px;
                    width: 400px;
                    height: 400px;

                    display: none;
                  "
                >
                  <img
                    type="text/javascript"
                    async
                    src="../images/bubbles2.gif"
                    style="width: 100%; height: 80%"
                  />
                </div>
                <div
                  id="shower-gif"
                  style="
                    position: absolute;
                    top: 70px;
                    right: -50px;
                    width: 400px;
                    height: 350px;
                    overflow: hidden;
                    transform: scaleX(-1);

                    display: none;
                  "
                >
                  <img
                    type="text/javascript"
                    async
                    src="../images/clean.gif"
                    style="width: 100%; height: 100%"
                  />
                </div>
                <div
                  id="dirt-overlay"
                  style="
                    position: absolute;
                    top: 112px;
                    width: 300px;
                    height: 300px;
                    border-radius: 130px;
                    overflow: hidden;
                    display: none;
                  "
                >
                  <img
                    type="text/javascript"
                    async
                    src="../images/DirtOverlay.png"
                    style="width: 100%; height: 100%"
                  />
                </div>

                <img
                  src="../images/googly-eyes-rock.png"
                  alt="rock"
                  style="width: 100%; height: 100%; object-fit: contain"
                  id="rock"
                />
              </head>

              <div class="grid-container">
                <button onclick="feed()">Feed</button>
                <button onclick="drink()">Water</button>
                <button onclick="togglePet()">Pet</button>
                <button onclick="walk()">Take on Walk</button>
                <button onclick="clean()">Clean Rock</button>
                <button>Slingshot</button>
              </div>
            </main>
            <footer>
              <tab-bar selected="home"></tab-bar>
            </footer>
          </div>
        </div>
      </div>
    </div>
    <script src="../TabBar.js"></script>
    <script src="../scripts.js"></script>
  </body>
</html>
