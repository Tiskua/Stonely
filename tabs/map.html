<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../styles/global.css" rel="stylesheet" />
    <link href="../styles/map.css" rel="stylesheet" />
    <link href="../Tabbar/TabBar.css" rel="stylesheet" />

    <script
      src="https://kit.fontawesome.com/e8b61a6feb.js"
      crossorigin="anonymous"
    ></script>

    <title>Stonely</title>
  </head>

  <body>
    <div id="main">
      <div id="iphone-outline">
        <!-- Full Screen google maps-->
        <div class="map-background">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d23313.033534294613!2d-77.67328243383785!3d43.08077919389274!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1794329270549!5m2!1sen!2sus"
            width="340"
            height="680"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
        </div>

        <div id="iphone-content">
          <div class="screen-layout">
            <main class="content"></main>
            <!-- Bottom Tabbar-->
            <footer>
              <tab-bar selected="map"></tab-bar>
            </footer>
          </div>
        </div>
      </div>
    </div>
    <script src="../Tabbar/TabBar.js"></script>
  </body>
</html>
