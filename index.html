<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="styles/global.css" rel="stylesheet" />
    <link href="login/login.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/e8b61a6feb.js"
      crossorigin="anonymous"
    ></script>
    <script src="login/login.js" defer></script>

    <title>Stonely</title>
  </head>

  <body>
    <div id="main">
      <div id="iphone-outline">
        <!-- Full screen background -->

        <div class="login-background"></div>
        <div id="iphone-content">
          <div class="screen-layout">
            <!-- Top of screen -->
            <main class="content">
              <h1 class="title">Stonely</h1>
            </main>
          </div>
        </div>
        <!-- Bottom sheet -->
        <div id="bottom-sheet-overlay">
          <div id="bottom-sheet">
            <h2 class="sheet-title">Welcome Back!</h2>
            <h3 class="sheet-subtitle">
              Your little rock has been waiting for you.
            </h3>
            <div
              style="
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
                margin-top: 30px;
              "
            >
              <!-- Username Input -->

              <div class="input-container">
                <i class="input-icon fa-solid fa-envelope"></i>
                <input
                  type="text"
                  id="username"
                  name="username"
                  class="custom-input"
                  placeholder="Username"
                />
              </div>
              <!-- Password Input -->

              <div class="input-container">
                <i class="input-icon fa-solid fa-lock"></i>
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="custom-input"
                  placeholder="Password"
                />
              </div>
            </div>
            <!-- Error message (Not really needed since we don't have auth)-->
            <p id="error-msg"></p>

            <!-- Login Button -->
            <button id="login-btn">
              Login
              <i class="fa-solid fa-arrow-right" style="margin-left: 5px"></i>
            </button>
            <div class="signup-footer">
              <p>
                Don't have an account?
                <a href="/signup/signup.html" class="signup-link"
                  >Create Account</a
                >
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
