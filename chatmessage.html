<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../styles/global.css" rel="stylesheet" />
    <link href="../styles/chat.css" rel="stylesheet" />

    <script
      src="https://kit.fontawesome.com/e8b61a6feb.js"
      crossorigin="anonymous"
    ></script>

    <title>Stonely</title>
  </head>

  <body>
    <div id="main">
      <div id="iphone-outline">
        <div id="iphone-content">
          <div class="screen-layout">
            <!-- Header (Back btn & Receiver Name) -->
            <div class="header-content">
              <a href="/tabs/chat.html" class="header-back"
                ><i class="fa-solid fa-chevron-left"></i>Back</a
              >
              <span class="person-title">Rock AI</span>
            </div>
            <main class="content">
              <!-- Messages container -->

              <div class="messages"></div>
              <!-- Chat toolbar for sending messages -->
              <div class="chat-toolbar">
                <!-- Text input -->

                <textarea
                  id="chat-input"
                  placeholder="Message..."
                  rows="1"
                ></textarea>
                <!-- Send Button -->

                <button id="send-btn" type="button" aria-label="Send message">
                  <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                </button>
              </div>
            </main>
          </div>
        </div>
      </div>
    </div>
    <script src="/scripts/chat-message.js"></script>
  </body>
</html>
