<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../styles/global.css" rel="stylesheet" />
    <link href="../styles/chat.css" rel="stylesheet" />

    <script
      src="https://kit.fontawesome.com/e8b61a6feb.js"
      crossorigin="anonymous"
    ></script>

    <title>Stonely</title>
  </head>

  <body>
    <div id="main">
      <div id="iphone-outline">
        <div id="iphone-content">
          <div class="screen-layout">
            <div class="header-content">
              <a href="/tabs/chat.html" class="header-back"
                ><i class="fa-solid fa-chevron-left"></i>Back</a
              >
              <span class="person-title">Rock AI</span>
              <span></span>
            </div>
            <main class="content">
              <div class="messages">
                <div class="message-container left">
                  <img src="/images/rok-logo.png" class="profile-image" />
                  <div class="bubble">
                    <div class="chat-text">Hi from AI</div>
                    <div class="chat-person">AI</div>
                  </div>
                </div>

                <div class="message-container right">
                  <div class="bubble">
                    <div class="chat-text">Hi from Person</div>
                    <div class="chat-person">Person</div>
                  </div>
                  <img
                    src="/images/default-profile.png"
                    class="profile-image"
                  />
                </div>
              </div>

              <div class="chat-toolbar">
                <textarea
                  id="chat-input"
                  placeholder="Message..."
                  rows="1"
                ></textarea>
                <button id="send-btn" type="button" aria-label="Send message">
                  <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                </button>
              </div>
            </main>
          </div>
        </div>
      </div>
    </div>
    <script src="/scripts/chat-message.js"></script>
  </body>
</html>
