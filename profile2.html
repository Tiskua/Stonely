<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="styles/global.css" rel="stylesheet" />
    <link href="styles/profile.css" rel="stylesheet" />
    <title>Stonely</title>
  </head>

  <body>
    <div id="main">
      <div id="iphone-outline">
        <div id="iphone-content">
          <div class="screen-layout">
            <header class="header">
              <h1>Create your profile!</h1>
            </header>

            <main class="content">
              <div class="inputer-container">
                <label for="username"
                  >Where would your rock feel at home?</label
                >
                <div class="environment-grid">
                  <label class="environment-option">
                    <input type="radio" name="environment" value="forest" />
                    <span class="environment-card">
                      <img src="images/forest.jpg" alt="Forest" />
                      <span>Forest</span>
                    </span>
                  </label>

                  <label class="environment-option">
                    <input type="radio" name="environment" value="beach" />
                    <span class="environment-card">
                      <img src="images/beach.jpg" alt="Beach" />
                      <span>Beach</span>
                    </span>
                  </label>

                  <label class="environment-option">
                    <input type="radio" name="environment" value="mountains" />
                    <span class="environment-card">
                      <img src="images/mountains.jpg" alt="Mountains" />
                      <span>Mountains</span>
                    </span>
                  </label>

                  <label class="environment-option">
                    <input type="radio" name="environment" value="desert" />
                    <span class="environment-card">
                      <img src="images/desert.jpg" alt="Desert" />
                      <span>Desert</span>
                    </span>
                  </label>
                </div>
              </div>

              <button><a href="profile3.html">Continue</a></button>
            </main>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
